<html>
    <head>
        <title style="color: blue;">LKPD 3-Tabel</title>
    </head>
    <body>
        <h2 style="color: blueviolet;">Tabel piket X-ACP</h2>
        <table border="1">
            <tr> <!--Baris pertama-->
                <th rowspan="2" style="color: gold;">Hari</th>
                <th colspan="2" style="color: gold;">Tugas piket</th>
            </tr>
            <tr> <!--Baris kedua-->
                <th style="color: lightpink;">menyapu</th>
                <th style="color: lightcoral;">menghapus papan</th>
            </tr>
            <tr> <!--baris ketiga-->
                <td style="color: firebrick;">Senin</td>
                <th style="color: palevioletred;">siti</th>
                <th style="color: palevioletred;">beni</th>
            </tr>
            <tr> <!--baris keempat-->
                <td style="color: firebrick;">Selasa</td>
                <th style="color: palevioletred;">syifa</th>
                <th style="color: palevioletred;">hasna</th>
            </tr>
            <tr> <!--Baris kelima-->
                <td style="color: firebrick;">Rabu</td>
                <th style="color: palevioletred;">disca</th>
                <th style="color: palevioletred;">diah</th>
            </tr>
            <tr> <!--Baris keenam-->
                <td style="color: firebrick;">Kamis</td>
                <th style="color: palevioletred;">udin</th>
                <th style="color: palevioletred;">edo</th>
            </tr>
            <tr> <!--baris ketujuh-->
                <td style="color: firebrick;">jum'at</td>
                <th style="color: palevioletred;">hawa</th>
                <th style="color: palevioletred;">bela</th>
            </tr>
        </table>
    </body>
</html>
